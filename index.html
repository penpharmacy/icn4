<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IC Hand Hygiene Audit – รพ.พุนพิน</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: 'Sarabun', sans-serif; background:#f0f2f5; }
.header-banner {
  background: linear-gradient(135deg,#11998e,#38ef7d);
  color:#fff; padding:25px; border-radius:0 0 25px 25px;
}
.card { border-radius:15px; box-shadow:0 4px 12px rgba(0,0,0,.05); border:none; }
.section-title {
  border-left:6px solid #11998e; padding-left:12px;
  color:#11998e; font-weight:bold;
}
.radio-group-box { background:#fafafa; padding:15px; border-radius:12px; }
.other-input { display:none; margin-top:8px; }
.no-print { }
@media print { .no-print { display:none!important; } }
</style>
</head>

<body>

<div class="header-banner text-center mb-3 no-print">
  <h3 class="fw-bold"><i class="fas fa-hands-wash"></i> Hand Hygiene Audit</h3>
  <p class="mb-0">โรงพยาบาลพุนพิน</p>
</div>

<div class="container-fluid px-lg-5">

<!-- ===== NAV ===== -->
<div class="mb-3 text-center no-print">
  <button class="btn btn-success me-2" onclick="showSection('form')">
    <i class="fas fa-edit"></i> บันทึกข้อมูล
  </button>
  <button class="btn btn-outline-primary" onclick="showSection('report')">
    <i class="fas fa-chart-bar"></i> รายงานผล
  </button>
</div>

<!-- ================= FORM SECTION ================= -->
<section id="section-form">

<div class="card p-4 mb-4 no-print">
<h5 class="section-title mb-3">บันทึกผลการสังเกตการณ์</h5>

<div class="row g-3 mb-3">
  <div class="col-md-3">
    <label class="fw-bold">วันที่</label>
    <input type="date" id="obsDate" class="form-control">
  </div>
  <div class="col-md-2">
    <label class="fw-bold">เวลา</label>
    <input type="time" id="obsTime" class="form-control">
  </div>
</div>

<div class="row g-4">
  <div class="col-md-3">
    <label class="fw-bold text-primary">แผนก</label>
    <div class="radio-group-box">
      <div class="form-check"><input class="form-check-input" type="radio" name="deptRadio" value="OPD"> OPD</div>
      <div class="form-check"><input class="form-check-input" type="radio" name="deptRadio" value="IPD"> IPD</div>
      <div class="form-check"><input class="form-check-input" type="radio" name="deptRadio" value="ER"> ER</div>
      <div class="form-check"><input class="form-check-input" type="radio" name="deptRadio" value="อื่นๆ" onclick="toggleOther('deptOther',true)"> อื่นๆ</div>
      <input id="deptOther" class="form-control form-control-sm other-input" placeholder="ระบุแผนก">
    </div>
  </div>

  <div class="col-md-3">
    <label class="fw-bold text-primary">วิชาชีพ</label>
    <div class="radio-group-box">
      <div class="form-check"><input class="form-check-input" type="radio" name="roleRadio" value="แพทย์"> แพทย์</div>
      <div class="form-check"><input class="form-check-input" type="radio" name="roleRadio" value="พยาบาล"> พยาบาล</div>
      <div class="form-check"><input class="form-check-input" type="radio" name="roleRadio" value="ผู้ช่วย"> ผู้ช่วย</div>
      <div class="form-check"><input class="form-check-input" type="radio" name="roleRadio" value="อื่นๆ" onclick="toggleOther('roleOther',true)"> อื่นๆ</div>
      <input id="roleOther" class="form-control form-control-sm other-input" placeholder="ระบุวิชาชีพ">
    </div>
  </div>

  <div class="col-md-6">
    <label class="fw-bold text-warning">ความพร้อมอุปกรณ์</label>
    <div class="row bg-light p-3 rounded">
      <div class="col-6">
        <div class="form-check"><input class="form-check-input equip" type="checkbox"> อ่างล้างมือ</div>
        <div class="form-check"><input class="form-check-input equip" type="checkbox"> สบู่</div>
        <div class="form-check"><input class="form-check-input equip" type="checkbox"> CHG</div>
        <div class="form-check"><input class="form-check-input equip" type="checkbox"> Alcohol</div>
      </div>
      <div class="col-6">
        <div class="form-check"><input class="form-check-input equip" type="checkbox"> กระดาษ</div>
        <div class="form-check"><input class="form-check-input equip" type="checkbox"> โปสเตอร์</div>
        <div class="form-check"><input class="form-check-input equip" type="checkbox"> ถังขยะ</div>
      </div>
    </div>
  </div>
</div>

<hr class="my-4">

<h6 class="fw-bold text-success">5 Moments</h6>
<div class="row g-3" id="momentInputList"></div>

<div class="text-end mt-4">
  <button class="btn btn-secondary" onclick="clearForm()">ล้างฟอร์ม</button>
  <button class="btn btn-success px-4" onclick="saveData()">
    <i class="fas fa-save"></i> บันทึก
  </button>
</div>

</div>
</section>

<!-- ================= REPORT SECTION ================= -->
<section id="section-report" style="display:none;">

<div id="main-report-container">

<div class="row g-3 mb-3">
  <div class="col-md-3"><div class="card p-3 text-center"><b>Compliance</b><div id="comp_rate">0%</div></div></div>
  <div class="col-md-3"><div class="card p-3 text-center"><b>HW</b><div id="hw_total">0%</div></div></div>
  <div class="col-md-3"><div class="card p-3 text-center"><b>HR</b><div id="hr_total">0%</div></div></div>
  <div class="col-md-3"><div class="card p-3"><canvas id="cleanPieChart"></canvas></div></div>
</div>

<div class="card p-4 mb-4">
  <h5 class="section-title">5 Moments (%)</h5>
  <canvas id="momentChart" height="120"></canvas>
</div>

</div>
</section>

</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzBrC7afQChoOR2RrSWUQXoX3B0pSkj-Vrrt0OIUSSd_Ms4YsLzPXUI5lvjm0QohtmD4w/exec";
const momentLabels=["ก่อนสัมผัสผู้ป่วย","ก่อนทำหัตถการ","หลังสัมผัสสารคัดหลั่ง","หลังสัมผัสผู้ป่วย","หลังสัมผัสสิ่งแวดล้อม"];
let database=[],momentChart,cleanPieChart;

function showSection(s){
  section-form.style.display=s==='form'?'block':'none';
  section-report.style.display=s==='report'?'block':'none';
}

window.onload=()=>{
  momentLabels.forEach((l,i)=>{
    momentInputList.innerHTML+=`
    <div class="col-md-4">
      <div class="border p-2 rounded">
        <b>${i+1}. ${l}</b><br>
        <label><input type="radio" name="m${i}" value="HW"> HW</label>
        <label><input type="radio" name="m${i}" value="HR"> HR</label>
        <label><input type="radio" name="m${i}" value="None"> ไม่ล้าง</label>
        <label><input type="radio" name="m${i}" value="Glove"> ถุงมือ</label>
      </div>
    </div>`;
  });
  initCharts();
  fetch(SCRIPT_URL).then(r=>r.json()).then(d=>{database=d;render(database);});
};

function initCharts(){
  momentChart=new Chart(momentChartCanvas,{type:'bar',data:{labels:['M1','M2','M3','M4','M5'],datasets:[{data:[0,0,0,0,0],backgroundColor:'#11998e'}]}});
}
</script>

</body>
</html>
