<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IC Hand Hygiene Audit & Report – รพ.พุนพิน</title>

<!-- CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: 'Sarabun', sans-serif; background:#f0f2f5; }
.header-banner { background:linear-gradient(135deg,#16a085,#2ecc71); color:#fff; padding:30px; border-radius:0 0 25px 25px; }
.card { border-radius:15px; box-shadow:0 4px 12px rgba(0,0,0,.05); }
.section-title { border-left:6px solid #16a085; padding-left:12px; font-weight:700; }
.dash-card { text-align:center; padding:20px; border-bottom:4px solid #16a085; }
.no-print { display:block; }
@media print {.no-print{display:none}}
</style>
</head>

<body>

<div class="header-banner text-center mb-4">
  <h3 class="fw-bold"><i class="fas fa-hands-wash"></i> Hand Hygiene Audit</h3>
  <small>โรงพยาบาลพุนพิน</small>
</div>

<div class="container-fluid px-lg-5">

<!-- ================= FORM SECTION ================= -->
<div class="card p-4 mb-4 no-print">
<h5 class="section-title">บันทึกผลการสังเกต</h5>

<div class="row g-3 mb-3">
  <div class="col-md-3"><input type="date" id="obsDate" class="form-control"></div>
  <div class="col-md-2"><input type="time" id="obsTime" class="form-control"></div>
</div>

<div class="row g-4">
  <div class="col-md-3">
    <label class="fw-bold">แผนก</label>
    <select id="dept" class="form-select">
      <option>OPD</option><option>IPD</option><option>ER</option><option>LR</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="fw-bold">วิชาชีพ</label>
    <select id="role" class="form-select">
      <option>แพทย์</option><option>พยาบาล</option><option>ผู้ช่วย</option>
    </select>
  </div>
</div>

<hr>

<h6 class="fw-bold text-success">5 Moments</h6>
<div class="row g-3" id="momentInputList"></div>

<div class="text-end mt-3">
  <button class="btn btn-success btn-lg" onclick="saveData()">
    <i class="fas fa-save"></i> บันทึก
  </button>
</div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard" style="display:none">

<div class="row g-3 mb-4">
  <div class="col-md-3"><div class="dash-card"><div>HW</div><div id="hw_val">0%</div></div></div>
  <div class="col-md-3"><div class="dash-card"><div>HR</div><div id="hr_val">0%</div></div></div>
  <div class="col-md-3"><div class="dash-card"><div>Compliance</div><div id="comp_val">0%</div></div></div>
  <div class="col-md-3"><div class="dash-card"><div>Equipment</div><div id="equip_val">0%</div></div></div>
</div>

<div class="row g-4">
  <div class="col-lg-6">
    <div class="card p-3"><canvas id="pieChart"></canvas></div>
  </div>
  <div class="col-lg-6">
    <div class="card p-3"><canvas id="momentChart"></canvas></div>
  </div>
</div>

</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXXXX/exec";
const momentLabels = [
 "ก่อนสัมผัสผู้ป่วย","ก่อนทำหัตถการสะอาด",
 "หลังสัมผัสสารคัดหลั่ง","หลังสัมผัสผู้ป่วย","หลังสัมผัสสิ่งแวดล้อม"
];

let database = [];
let pieChart, momentChart;

/* ---------- INIT ---------- */
window.onload = () => {
  initMomentInput();
  fetchData();
};

function initMomentInput(){
  const box = document.getElementById("momentInputList");
  momentLabels.forEach((m,i)=>{
    box.innerHTML += `
    <div class="col-md-4">
      <div class="border p-2 rounded">
        <small>${m}</small><br>
        <select class="form-select mt-1" id="m${i}">
          <option value="">-</option>
          <option value="HW">HW</option>
          <option value="HR">HR</option>
          <option value="None">ไม่ล้าง</option>
          <option value="Glove">ถุงมือ</option>
        </select>
      </div>
    </div>`;
  });
}

/* ---------- SAVE ---------- */
function saveData(){
  const rec = {
    obsDate: obsDate.value,
    obsTime: obsTime.value,
    dept: dept.value,
    role: role.value,
    m: momentLabels.map((_,i)=>document.getElementById(`m${i}`).value),
    equips:[1,1,1,1,1,1,1] // mock
  };
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(rec)});
  database.push(rec);
  renderAll(database);
  alert("บันทึกแล้ว");
}

/* ---------- FETCH ---------- */
function fetchData(){
  fetch(SCRIPT_URL).then(r=>r.json()).then(d=>{
    database=d;
    renderAll(database);
  });
}

/* ---------- RENDER ---------- */
function renderAll(data){
  if(data.length===0) return;
  dashboard.style.display="block";

  let hw=0,hr=0,none=0,glove=0;
  let mComp=[0,0,0,0,0], mTotal=[0,0,0,0,0];

  data.forEach(d=>{
    d.m.forEach((v,i)=>{
      if(!v) return;
      mTotal[i]++;
      if(v==="HW"){hw++;mComp[i]++;}
      else if(v==="HR"){hr++;mComp[i]++;}
      else if(v==="None") none++;
      else glove++;
    });
  });

  const total = hw+hr+none+glove;
  hw_val.innerText = ((hw/total)*100||0).toFixed(1)+"%";
  hr_val.innerText = ((hr/total)*100||0).toFixed(1)+"%";
  comp_val.innerText = (((hw+hr)/total)*100||0).toFixed(1)+"%";
  equip_val.innerText = "100%";

  drawCharts(hw,hr,none,glove,mComp,mTotal);
}

function drawCharts(hw,hr,none,glove,mComp,mTotal){
  if(pieChart) pieChart.destroy();
  pieChart=new Chart(pieChart?.ctx||document.getElementById("pieChart"),{
    type:'pie',
    data:{labels:['HW','HR','None','Glove'],datasets:[{data:[hw,hr,none,glove]}]}
  });

  if(momentChart) momentChart.destroy();
  momentChart=new Chart(document.getElementById("momentChart"),{
    type:'bar',
    data:{labels:['M1','M2','M3','M4','M5'],
      datasets:[{data:mComp.map((c,i)=>mTotal[i]?c/mTotal[i]*100:0)}]
    }
  });
}
</script>
</body>
</html>
